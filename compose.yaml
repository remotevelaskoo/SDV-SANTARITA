name: sdv-access

services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdv

  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sdv

  queue:
    build:
      context: .
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdv

  scheduler:
    build:
      context: .
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdv

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sdv_access
      POSTGRES_USER: sdv_access
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdv_access -d sdv_access"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sdv

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sdv

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sdv_local
      MINIO_ROOT_PASSWORD: local_only_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sdv

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 sdv_local local_only_change_me;
        do sleep 1; done;
        mc mb --ignore-existing local/sdv-access-local;
        mc anonymous set none local/sdv-access-local;
    networks:
      - sdv

  frontend:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - sdv

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vendor:
  node_modules:

networks:
  sdv:
    driver: bridge

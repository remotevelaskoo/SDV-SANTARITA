name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar o PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Preparar o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Preparar o Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validar o Composer
        run: composer validate --strict --no-check-publish

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependencias visuais
        run: pnpm install --frozen-lockfile

      - name: Compilar o frontend
        run: pnpm run build

      - name: Preparar o ambiente Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar o estilo PHP
        run: vendor/bin/pint --test

      - name: Executar os testes
        run: php artisan test
